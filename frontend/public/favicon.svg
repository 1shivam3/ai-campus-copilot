<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cap Top Gradient -->
    <linearGradient id="capTop" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F2870" />
    </linearGradient>

    <!-- Cap Highlight Edge -->
    <linearGradient id="capHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- C-Ribbon Main Outer Arc Gradient -->
    <linearGradient id="cRibbonMain" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="30%" stop-color="#0077E6" />
      <stop offset="65%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- C-Ribbon Top Fold / Under-Cap -->
    <linearGradient id="cFoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- C-Ribbon Bottom Turn / Return -->
    <linearGradient id="cFoldBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Pilot Navigation Arrow (Bright Cyan) -->
    <linearGradient id="arrowFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <linearGradient id="arrowFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Depth -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1D4ED8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. The Dynamic C-Ribbon Body (Smooth Sweep) -->
  <g filter="url(#subtleGlow)">
    <!-- Outer Curved Back & Bottom Loop of 'C' -->
    <path
      d="M 50 25
         C 32 25, 20 38, 20 54
         C 20 70, 33 83, 50 83
         C 58 83, 64 80, 68 76
         L 57 69
         C 54 71, 51 72, 48 72
         C 38 72, 30 64, 30 54
         C 30 43, 38 35, 49 35
         C 57 35, 63 39, 67 44
         L 76 36
         C 70 29, 61 25, 50 25 Z"
      fill="url(#cRibbonMain)"
    />

    <!-- Upper Top Arch Segment connecting to Cap -->
    <path
      d="M 33 46
         C 36 36, 44 29, 54 29
         C 63 29, 71 34, 76 41
         L 66 48
         C 63 43, 58 40, 53 40
         C 46 40, 40 45, 37 51
         Z"
      fill="url(#cFoldTop)"
    />

    <!-- Bottom Return Wing / Fold of 'C' -->
    <path
      d="M 46 72
         C 53 72, 60 69, 65 64
         L 74 72
         C 67 79, 58 83, 48 83
         C 43 83, 38 82, 34 79
         L 41 71
         C 43 72, 44 72, 46 72 Z"
      fill="url(#cFoldBottom)"
    />
  </g>

  <!-- 2. Academic Mortarboard / Graduation Cap -->
  <g filter="url(#subtleGlow)">
    <!-- Cap Diamond / Rhombus Top Surface -->
    <path
      d="M 50 8
         L 83 23
         L 50 38
         L 17 23
         Z"
      fill="url(#capTop)"
    />

    <!-- Cap Top Bevel Highlight (Cyan edge) -->
    <path
      d="M 50 8
         L 83 23
         L 79 24.5
         L 50 11.5
         L 21 24.5
         L 17 23
         Z"
      fill="url(#capHighlight)"
      opacity="0.9"
    />

    <!-- Cap Skull Base (Under-rim) -->
    <path
      d="M 28 28
         C 28 28, 38 37, 50 37
         C 62 37, 72 28, 72 28
         L 72 32
         C 72 32, 62 41, 50 41
         C 38 41, 28 32, 28 32
         Z"
      fill="#0F2870"
    />

    <!-- Tassel Ribbon & Pendant -->
    <!-- Tassel String -->
    <path
      d="M 50 23
         Q 70 24 74 34
         L 75 44"
      stroke="#1E40AF"
      stroke-width="1.8"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Tassel Button on Cap Center -->
    <circle cx="50" cy="23" r="2.2" fill="#38BDF8" />
    
    <!-- Tassel Bell / Drop Shape -->
    <path
      d="M 73.5 43
         L 76.5 43
         L 78 52
         C 78 53.5, 72 53.5, 72 52
         Z"
      fill="#1D4ED8"
    />
    <circle cx="75" cy="43.5" r="1.5" fill="#38BDF8" />
  </g>

  <!-- 3. Pilot Compass Navigation Arrow (Centered Inside 'C') -->
  <g filter="url(#subtleGlow)">
    <!-- Left Facet (Light Bright Cyan) -->
    <path
      d="M 58 39
         L 42 58
         L 49 55
         Z"
      fill="url(#arrowFacetLeft)"
    />

    <!-- Right Facet (Deep Azure Cyan Shadow) -->
    <path
      d="M 58 39
         L 49 55
         L 52 68
         Z"
      fill="url(#arrowFacetRight)"
    />
  </g>
</svg>